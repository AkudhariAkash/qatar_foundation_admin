<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Qatar Foundation Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <main class="container">
    <section class="card" style="max-width: 520px; margin: 0 auto;">
      <h2>Reset Password</h2>
      <form id="resetForm">
        <label>New Password<input type="password" name="password" minlength="8" required /></label>
        <label>Confirm Password<input type="password" name="confirm_password" minlength="8" required /></label>
        <div class="actions">
          <button class="btn" type="submit">Update Password</button>
          <a class="btn secondary" href="{{ url_for('main.login_page') }}?view=login">Back to Login</a>
        </div>
      </form>
    </section>
  </main>
  <div id="toast"></div>
  <script>
    function toast(message) {
      const box = document.getElementById("toast");
      box.textContent = message;
      box.classList.add("show");
      setTimeout(() => box.classList.remove("show"), 2500);
    }

    document.getElementById("resetForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const payload = Object.fromEntries(form.entries());

      const res = await fetch("/api/reset-password/{{ token }}", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      const data = await res.json();
      toast(data.message || "Request processed");
      if (data.status === "success") {
        setTimeout(() => {
          window.location.href = "{{ url_for('main.login_page') }}?view=login";
        }, 700);
      }
    });
  </script>
</body>
</html>
