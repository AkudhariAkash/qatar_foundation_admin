<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Qatar Foundation Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <main class="container">
    <section class="card">
      <div class="header-row">
        <h2>Welcome, {{ user.full_name }}</h2>
        <button id="logoutBtn" class="btn danger">Logout</button>
      </div>

      <h3 id="formTitle">Add Opportunity</h3>
      <form id="opportunityForm">
        <input type="hidden" name="id" />
        <label>Name<input type="text" name="name" placeholder="AI Research Internship - Summer 2026" required /></label>
        <label>Duration<input type="text" name="duration" placeholder="12 Weeks" required /></label>
        <label>Start Date<input type="date" name="start_date" required /></label>
        <label>Description<textarea name="description" placeholder="Work on NLP models, evaluate datasets, and present weekly progress reports." required></textarea></label>
        <label>Skills<input type="text" name="skills" placeholder="Python, Flask, SQL, Communication" required /></label>
        <label>Category
          <select name="category" required>
            <option value="Technology">Technology</option>
            <option value="Business">Business</option>
            <option value="Design">Design</option>
            <option value="Marketing">Marketing</option>
            <option value="Healthcare">Healthcare</option>
            <option value="Education">Education</option>
            <option value="Finance">Finance</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <label>Max Applicants<input type="number" name="max_applicants" min="1" placeholder="50" required /></label>
        <label class="checkbox"><input type="checkbox" name="future_opportunities" /> Future Opportunities</label>
        <div class="actions">
          <button class="btn" type="submit">Save</button>
          <button class="btn secondary" type="button" id="cancelEdit">Cancel Edit</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h3>Your Opportunities</h3>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Start Date</th>
            <th>Max Applicants</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="opportunityRows"></tbody>
      </table>
    </section>
  </main>
  <div id="toast"></div>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
